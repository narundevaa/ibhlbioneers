<!DOCTYPE html>

<html lang="en">
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>
            IBHL Bioneers
        </title>
    
        <meta name="description" content="IB Biology study guides & quizzes (HL/SL) — IBHL Bioneers" />
        <style>
            :root {
    --accent: #127811;
    --muted: #6b7280;
    --bg: #f7f8fb;
    --card: #ffffff;
    --glass: rgba(255,255,255,0.7);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Comic Sans MS", Roboto, "Helvetica Neue", Arial;
}

* {
    box-sizing: border-box
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);
    color: #0f172a;
}

header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 28px;
    background: transparent;
    box-shadow: 0 2px 10px #1e4a07;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px
}

    .logo .mark {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        background: linear-gradient(135deg,var(--accent),#7dca30);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 18px
    }

    .logo .title {
        font-weight: 700
    }

main {
    max-width: 1200px;
    margin: 75px auto;
    padding: 20px
}

.search-wrap {
    text-align: center;
    margin-bottom: 20px
}

.search {
    display: inline-flex;
    width: 100%;
    max-width: 760px;
    border-radius: 12px;
    overflow: hidden;
    padding: 6px;
    background: var(--card);
    box-shadow: 0 6px 18px rgba(13, 38, 76, 0.06)
}

    .search input {
        flex: 1;
        padding: 14px 16px;
        border: 0;
        font-size: 16px;
        background: transparent;
        outline: none
    }

    .search button {
        background: linear-gradient(135deg,var(--accent),#7dca30);
        border: 0;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        margin-right: 6px
    }

.nav-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
    margin: 18px 0
}

.nav-card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease
}

    .nav-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 5px 20px #1e4a07
    }

    .nav-card h3 {
        margin: 8px 0 0
    }

.small {
    font-size: 13px;
    color: var(--muted)
}

.content {
    display: block;
    margin-top: 12px
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
    gap: 14px;
}

.guide {
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 150px
}

.thumb {
    height: 150px;
    background: linear-gradient(180deg,#eef 0%,#fff 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-weight: 600
}

    .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        border-radius: 12px;
    }

.meta {
    display: flex;
    justify-content: space-between;
    align-items: center
}

.tag {
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid rgba(15,23,42,.04)
}

footer {
    max-width: 1100px;
    margin: 26px auto;
    padding: 20px;
    text-align: center;
    color: var(--muted)
}

/* quiz */
.quiz-card {
    background: var(--card);
    padding: 18px;
    border-radius: 10px
}

.choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px
}

.choice {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(15,23,42,.06);
    cursor: pointer
}

    .choice.correct {
        border-color: green;
        background: rgba(16,185,129,.07)
    }

    .choice.wrong {
        border-color: red;
        background: rgba(239,68,68,.06)
    }

/* small screens */
@media (max-width:700px) {
    .nav-grid {
        grid-template-columns: repeat(2,1fr)
    }

    .logo .title {
        display: none
    }

    .grid {
        grid-template-columns: repeat(auto-fill,minmax(160px,1fr))
    }
}

        </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="mark">IBB</div>
            <div class="title">IBHL <span style="color:var(--muted);font-weight:500">Bioneers</span></div>
        </div>
    </header>

    <main>
        <section class="search-wrap">
            <div class="search">
                <input id="searchInput" placeholder="Search study guides, quizzes, topics, etc." />
                <button id="searchBtn">Search</button>
            </div>
        </section>

        <section class="nav-grid" role="navigation" aria-label="main navigation">
            <div class="nav-card" data-route="#/" onclick="navigate('#/')">
                <div style="font-size:24px">🏠</div>
                <h3>Home</h3>
                <div class="small">Quick links and search</div>
            </div>
            <div class="nav-card" data-route="#/guides" onclick="navigate('#/guides')">
                <div style="font-size:24px">📚</div>
                <h3>Study Guides</h3>
                <div class="small">PDF previews organized by HL/SL</div>
            </div>
            <div class="nav-card" data-route="#/quizzes" onclick="navigate('#/quizzes')">
                <div style="font-size:24px">📝</div>
                <h3>Study Quizzes</h3>
                <div class="small">Interactive quizzes like Quizlet</div>
            </div>
        </section>

        <section id="app" class="content">
        </section>

    </main>
<script>
// --- Data: Add your PDF URLs and quizzes here ---
const guides =
    [
        { id: 'g1', title: 'Water Study Guide', level: 'HLY1', tags: ['water', 'solvation', 'solvent', 'polar', 'hydr'], pdf: 'assets/guides/WaterStudyGuide.pdf', thumb: 'assets/thumbnails/WaterStudyGuide.png' },
        { id: 'g2', title: 'Organic Chemistry, Carbs, & Lipids Study Guide', level: 'HLY1', tags: ['ochem', 'organic', 'chemistry', 'carbs', 'lipids', 'carbohydrates', 'sugars', 'membrane'], pdf: 'assets/guides/OrganicChemistryStudyGuide.pdf', thumb: 'assets/thumbnails/OrganicChemistryStudyGuide.png'},
        { id: 'g3', title: 'Proteins Study Guide', level: 'HLY1', tags: ['protein', 'pepride', 'disulfide', 'amino', 'acid', 'structure', 'carboxyl', 'r group', 'denaturation'], pdf: 'assets/guides/ProteinsStudyGuide.pdf', thumb: 'assets/thumbnails/ProteinsStudyGuide.png' },
        { id: 'g4', title: 'Enzymes & Metabolism Study Guide', level: 'HLY1', tags: ['enzyme', 'motabolism', 'anabolic', 'catabolic', 'hydrolysis', 'activation energy', 'denaturation' ], pdf: 'assets/guides/Enzymes&MetabolismStudyGuide.pdf', thumb: 'assets/thumbnails/Enzymes&MetabolismStudyGuide.png' },
        { id: 'g5', title: 'Origin of Cells + Microscopy Study Guide', level: 'HLY1', tags: ['origin', 'cells', 'RNA', 'ribosome', 'double-helix', 'm=ia', 'micro', 'cell theory'], pdf: 'assets/guides/OriginOfCells+MicroscopyStudyGuide.pdf', thumb: 'assets/thumbnails/OriginOfCells+MicroscopyStudyGuide.png' },
        { id: 'g6', title: 'Eukaryote Cells Study Guide', level: 'HLY1', tags: ['eukaryote', 'prokaryote', 'cells', 'multicellular', 'flagella', 'nucleus', 'nucleolus'], pdf: 'assets/guides/EukaryoteCellsStudyGuide.pdf', thumb: 'assets/thumbnails/EukaryoteCellsStudyGuide.png' },
        { id: 'g7', title: 'Cellular Differentiation Study Guide', level: 'HLY1', tags: ['cellular differentiation', 'differentiation', 'specialization', 'function', 'expression', 'gene', 'stem', 'cell', 'tissue'], pdf: 'assets/guides/CellularDifferentiationStudyGuide.pdf', thumb: 'assets/thumbnails/CellularDifferentiationStudyGuide.png' }
    ];

const quizzes =
    [
        {
            id: 'q1', title: 'Water', level: 'HLY1', questions:
                [
                    { q: 'Why is water considered the “medium of life”?', choices: ['It only exists in oceans', 'Most life processes occur in water', 'It is always frozen', 'It cannot dissolve substances'], answer: 1 },
                    { q: 'What type of bond holds hydrogen and oxygen together within a water molecule?', choices: ['Ionic bond', 'Hydrogen bond', 'Polar covalent bond', 'Metallic bond'], answer: 2 },
                    { q: 'Why is water a polar molecule?', choices: ['Electrons are shared equally', 'Oxygen has no charge', 'Electrons are shared unequally', 'Hydrogen has more electrons'], answer: 2 },
                    { q: 'What causes hydrogen bonds between water molecules?', choices: ['Attraction between partial charges', 'Equal electron sharing', 'Transfer of electrons', 'Nuclear forces'], answer: 0 },
                    { q: 'What is cohesion?', choices: ['Water sticking to other substances', 'Water molecules attracting each other', 'Water evaporating', 'Water dissolving salts'], answer: 1 },
                    { q: 'Which process helps water move up through plant xylem?', choices: ['Diffusion only', 'Osmosis only', 'Active transport', 'Cohesion and adhesion'], answer: 3 },
                    { q: 'What is adhesion?', choices: ['Water sticking to itself', 'Water repelling other molecules', 'Water sticking to other substances', 'Water turning into gas'], answer: 2 },
                    { q: 'Why can water dissolve many substances?', choices: ['It has partial positive and negative charges', 'It is nonpolar', 'It has no charge', 'It is solid'], answer: 0 },
                    { q: 'Which of the following is an example of a hydrophobic substance?', choices: ['Salt', 'Sugar', 'Amino acids', 'Lipids'], answer: 3 },
                    { q: 'Why does water have a high specific heat capacity?', choices: ['It has no bonds', 'Hydrogen bonds require a lot of energy to break', 'Covalent bonds require a lot of energy to break', 'It is very dense'], answer: 1 }
                ]
        },

        {
            id: 'q2', title: 'Organic Chemistry, Carbohydrates, and Lipids', level: 'HLY1', questions:
                [
                    { q: 'How many covalent bonds can a carbon atom typically form?', choices: ['2', '3', '4', '6'], answer: 2 },
                    { q: 'Which of the following is a carboxyl functional group?', choices: ['–NH₂', '–OH', ' –PO₄', '–COOH'], answer: 3 },
                    { q: 'Which class of biomolecules provides long-term energy storage and forms cell membranes?', choices: ['Carbohydrates', 'Lipids', 'Proteins', 'Nucleic acids'], answer: 1 },
                    { q: 'What is the main difference between anabolic and catabolic reactions?', choices: ['Anabolic builds molecules, catabolic breaks them down', 'Both break down molecules', ' Anabolic breaks down molecules, catabolic builds them', 'Both build molecules'], answer: 0 },
                    { q: 'What happens during a condensation reaction?', choices: ['Water is used to break bonds', 'Water is released when bonds form', ' Oxygen is added', 'Energy is destroyed'], answer: 1 },
                    { q: 'Which process breaks polymers into monomers?', choices: ['Condensation', 'Oxidation', ' Hydrolysis', 'Reduction'], answer: 2 },
                    { q: 'What is a key property of glucose that makes it useful in the body?', choices: ['It is insoluble in water', 'It cannot be transported', ' It contains nitrogen', 'It is soluble and easily transported'], answer: 3 },
                    { q: 'What is the main structural difference between glycogen and amylose?', choices: ['Glycogen has no branches', 'Glycogen is highly branched', ' Amylose is highly branched', 'Both have identical structures'], answer: 1 },
                    { q: 'Why are lipids considered hydrophobic?', choices: ['They are polar', 'They dissolve in water', ' They are nonpolar', 'They contain phosphate groups'], answer: 2 },
                    { q: 'What is the difference between saturated and unsaturated fatty acids?', choices: ['Saturated have double bonds, unsaturated do not', 'Unsaturated have one or more double bonds', ' Saturated contain oxygen', 'Unsaturated are always solid'], answer: 1 }
                ]
        }
    ];

// --- Router ---
function navigate(hash) {
    location.hash = hash
    render();
}

function render() {
    const app = document.getElementById('app');
    const route = location.hash || '#/';
    if (route == '#/')
        renderHome(app);
    else if (route.startsWith('#/guides'))
        renderGuides(app);
    else if (route.startsWith('#/quizzes'))
        renderQuizzes(app);
    else renderNotFound(app);
}

// --- Helpers ---
function el(tag, className, inner) {
    const e = document.createElement(tag);
    if (className)
        e.className = className;
    if (inner !== undefined)
        e.innerHTML = inner;
    return e;
}

// --- Home ---
function renderHome(container) {
    container.innerHTML = '';
    const h = el('div', '', `<h2>Welcome to IBHL Bioneers</h2><p class="large">Home page for your bioneering journey!</p>`);
    container.appendChild(h);

    // Quick links
    const grid = el('div', 'grid');

    // show 4 "featured" items
    let lower = ((Math.random() * (guides.length - 3)) / 1);
    let upper = lower + 4;

    const featuredGuides = guides.slice(lower, upper+1);
    const featuredQuizzes = quizzes.slice(lower, upper-2);

    featuredGuides.forEach(g => {
        const c = el('div', 'guide');
        const thumb = el('div', 'thumb', g.thumb ? `<img src="${g.thumb}" alt="Preview of ${g.title}" />` : `<span>No preview</span>`);
        const title = el('div', '', `<strong>${g.title}</strong>`);
        const meta = el('div', 'meta', `<div class="tag">${g.level}</div><div><button onclick="openGuide('${g.id}')">Open</button></div>`);
        c.appendChild(thumb); 
        c.appendChild(title); 
        c.appendChild(meta);
        grid.appendChild(c);
    });

    featuredQuizzes.forEach(q => {
        const c = el('div', 'guide');
        const thumb = el('div', 'thumb', `<span>Quiz</span>`);
        const title = el('div', '', `<strong>${q.title}</strong>`);
        const meta = el('div', 'meta', `<div class="tag">${q.level}</div><div><button onclick="startQuiz('${q.id}')">Start</button></div>`);
        c.appendChild(thumb);
        c.appendChild(title);
        c.appendChild(meta);
        grid.appendChild(c);
    });
    container.appendChild(grid);
}

// --- Guides page ---
function renderGuides(container, filter = '') {
    container.innerHTML = '';
    const header = el('div', '', `<h2>Study Guides</h2><p class="small">Click a card to open the PDF (opens in new tab). Guides are grouped by HL/SL and searchable.</p>`);
    container.appendChild(header);
    const grid = el('div', 'grid');
    const results = guides.filter(g => {
        if (!filter)
            return true;
        const s = filter.toLowerCase();
        return g.title.toLowerCase().includes(s) || g.level.toLowerCase().includes(s) || (g.tags && g.tags.join(' ').toLowerCase().includes(s));
    });

    if (results.length === 0) {
        container.appendChild(el('p', 'small', 'No guides matched your search.')); return
    }
    results.forEach(g => {
        const card = el('div', 'guide');
        const thumb = el('div', 'thumb', g.thumb ? `<img src="${g.thumb}" alt="Preview of ${g.title}" />` : `<span>No preview</span>`);
        const title = el('div', '', `<strong>${g.title}</strong>`);
        const meta = el('div', 'meta', `<div class="tag">${g.level}</div><div><button onclick="openGuide('${g.id}')">Open</button></div>`);
        card.appendChild(thumb);
        card.appendChild(title);
        card.appendChild(meta);
        grid.appendChild(card);
    });
    container.appendChild(grid);
}

function openGuide(id) {
    const g = guides.find(x => x.id === id);
    if (!g)
        return alert('Guide not found');
    if (g.pdf) {
        window.open(g.pdf, '_blank');
    }
    else alert('PDF not uploaded yet. Place the PDF in /assets/guides and update the guides array in index.html with its filename.');
}

// --- Quizzes page ---
function renderQuizzes(container, filter = '') {
    container.innerHTML = '';
    const header = el('div', '', `<h2>Study Quizzes</h2><p class="small">Select a quiz to start. Answers are shown at the end and stored locally for review.</p>`);
    container.appendChild(header);
    const list = el('div', 'grid');
    const results = quizzes.filter(q => {
        if (!filter)
            return true;
        const s = filter.toLowerCase();
        return q.title.toLowerCase().includes(s) || q.level.toLowerCase().includes(s)
    });

    if (results.length === 0) {
        container.appendChild(el('p', 'small', 'No quizzes matched your search.')); return
    }
    results.forEach(q => {
        const card = el('div', 'guide');
        const thumb = el('div', 'thumb', `<span>Quiz</span>`);
        const title = el('div', '', `<strong>${q.title}</strong>`);
        const meta = el('div', 'meta', `<div class="tag">${q.level}</div><div><button onclick="startQuiz('${q.id}')">Start</button></div>`);
        card.appendChild(thumb);
        card.appendChild(title);
        card.appendChild(meta);
        list.appendChild(card);
    });
    container.appendChild(list);
}

// --- Quiz runner ---
let current = { quiz: null, index: 0, score: 0, answers: [] };
function startQuiz(id) {
    const q = quizzes.find(x => x.id === id); if (!q) return;
    current.quiz = q; current.index = 0; current.score = 0; current.answers = [];
    renderQuizQuestion();
}

function renderQuizQuestion() {
    const container = document.getElementById('app'); container.innerHTML = '';
    const q = current.quiz.questions[current.index];
    const card = el('div', 'quiz-card');
    card.innerHTML = `<h2>${current.quiz.title}: Question ${current.index + 1}/${current.quiz.questions.length}</h2><h3>${q.q}</h3>`;
    const choices = el('div', 'choices');
    q.choices.forEach((c, i) => {
        const ch = el('div', 'choice', c);
        ch.onclick = () => selectChoice(i);
        choices.appendChild(ch);
    });
    card.appendChild(choices);
    container.appendChild(card);
}

function selectChoice(i) {
    const qObj = current.quiz.questions[current.index];
    const isCorrect = i === qObj.answer;
    current.answers.push({ question: qObj.q, chosen: i, correct: qObj.answer });
    if (isCorrect)
        current.score += 1;

    // show feedback
    const choices = document.querySelectorAll('.choice');
    choices.forEach((c, idx) => {
        c.classList.remove('correct', 'wrong');
        if (idx === qObj.answer)
            c.classList.add('correct');
        if (idx === i && idx !== qObj.answer)
            c.classList.add('wrong');
        c.onclick = null;
    });

    // next button
    setTimeout(() => {
        current.index += 1;
        if (current.index < current.quiz.questions.length)
            renderQuizQuestion();
        else
            renderQuizResult();
    }, 700);
}

function renderQuizResult() {
    const container = document.getElementById('app'); container.innerHTML = '';
    const card = el('div', 'quiz-card');
    card.innerHTML = `<h2>${current.quiz.title}: Result</h2><h3>Score: ${current.score} / ${current.quiz.questions.length}</h3>`;
    const review = el('div');
    current.answers.forEach((a, idx) => {
        const correct = a.correct; const chosen = a.chosen;
        const q = current.quiz.questions[idx];
        const item = el('div', '', `<strong>Q${idx + 1}.</strong> ${a.question} <div class="small">Your answer: ${q.choices[chosen]} | Correct: ${q.choices[correct]}</div><hr/>`);
        review.appendChild(item);
    });
    card.appendChild(review);
    const back = el('div', '', `<div style="margin-top:12px"><button onclick= "navigate('#/quizzes')">Back to quizzes</button></div>`);
    card.appendChild(back);
    container.appendChild(card);
}

function renderNotFound(container) {
    container.innerHTML = '<h2>Page not found</h2>'
}

// --- Search ---
function doSearch(term) {
    if (!term) {
        navigate('#/');
        return;
    }

    // search guides and quizzes
    const gMatches = guides.filter(g => (g.title + ' ' + g.tags.join(' ') + ' ' + g.level).toLowerCase().includes(term.toLowerCase()));
    const qMatches = quizzes.filter(q => (q.title + ' ' + q.level).toLowerCase().includes(term.toLowerCase()));

    // If both empty, show no results on guides page
    if (gMatches.length === 0 && qMatches.length === 0) {
        // show generic page with no results
        const app = document.getElementById('app'); app.innerHTML = `<h2>No results found for "${term}"</h2><p class="small">Try different keywords or check HL1 / HL2 / SL tags.</p>`; return;
    }

    // Prefer showing the combined results page
    const app = document.getElementById('app'); app.innerHTML = '';
    const h = el('div', '', `<h2>Search results for "${term}"</h2>`); app.appendChild(h);
    if (gMatches.length) {
        const gsec = el('div', '', `<h3>Guides</h3>`);
        app.appendChild(gsec); const grid = el('div', 'grid');
        gMatches.forEach(g => {
            const card = el('div', 'guide');
            const thumb = el('div', 'thumb', g.thumb ? `<img src="${g.thumb}" alt="Preview of ${g.title}" />` : `<span>No preview</span>`);
            const title = el('div', '', `<strong>${g.title}</strong>`);
            const meta = el('div', 'meta', `<div class="tag">${g.level}</div><div><button onclick="openGuide('${g.id}')">Open</button></div>`);
            card.appendChild(thumb);
            card.appendChild(title);
            card.appendChild(meta);
            grid.appendChild(card);
        });
        app.appendChild(grid);
    }

    if (qMatches.length) {
        const qsec = el('div', '', `<h3>Quizzes</h3>`);
        app.appendChild(qsec); const grid2 = el('div', 'grid');
        qMatches.forEach(q => {
            const card = el('div', 'guide');
            card.innerHTML = `<div class="thumb">Quiz</div><strong>${q.title}</strong><div class="meta"><div class="tag">${q.level}</div><div><button onclick="startQuiz('${q.id}')">Start</button></div></div>`;
            grid2.appendChild(card);
        }); app.appendChild(grid2)
    }
}

// --- events ---
document.getElementById('searchBtn').addEventListener('click', () => {
    const v = document.getElementById('searchInput').value.trim();
    doSearch(v);
});

document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        doSearch(e.target.value.trim())
    }
});
window.addEventListener('hashchange', render);

// initial render
render();

// --- Notes for maintainer (visible in code) ---
/*

To add guides:
- Place PDFs in /assets/guides
- Add an entry to `guides` array with {id,title,level,tags,pdf:'assets/guides/yourfile.pdf'}

To add quizzes:
- Edit `quizzes` array. Each quiz: {id,title,level,questions:[{q,choices:[..],answer:index}]}

This is a pure static site (single file). For production you may split into files and add proper thumbnails.
*/

</script>
