<!DOCTYPE html>

<html lang="en">
  <head>
      <title>Trial Website</title>
      <style>
          img {
              width: 300px;
              height: auto;
              border-radius: 10px;
              float: left;
              margin-right: 20px;
          }

          .name {
              font-family: 'Times New Roman', 'Segoe UI';
              line-height: 1.6;
              font-size: 24px;
              font-weight: bold;
          }

          .description {
              font-family: 'Times New Roman', Times, serif, 'Segoe UI';
              line-height: 1.6;
              font-size: 20px;
              line-break: auto;
          }

          button {
              background-color: #808080;
              border: none;
              color: white;
              padding: 15px 32px;
              text-align: center;
              text-decoration: none;
              display: inline-block;
              font-size: 16px;
              margin: 4px 2px;
              cursor: pointer;
              border-radius: 12px;
          }
      </style>
  </head>
  <body>
      <img src="images/bugatti.png" />
      <p class="name">Bugatti Chiron</p>
      <p class="description">The Bugatti Chiron is a mid-engine two-seater sports car developed and manufactured in Molsheim, France by Bugatti Automobiles S.A.S. It is named after the Monegasque driver Louis Chiron.</p>
      <button onclick="window.location='index.html'"></button>
  </body>
</html>
